<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面跳转中…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      color: #666;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: #999;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>正在跳转，请稍候…</p>

  <script>
    // 整蛊链接池（国内可访问的网站）：想增删或替换链接，直接改这里
    const PRANK_LINKS = [
      "https://www.bilibili.com/video/BV1kwYP6PEtTk", // 冰冰冰一小时
      "https://www.bilibili.com/video/BV1GJ411x7h7", // 你被骗了
      "https://www.4399.com/",                        // 4399 小游戏
      "https://www.bilibili.com/video/BV1CKYK6uE4B", //wjw 爱上了 jjs
      "https://www.bilibili.com/video/BV1t8hG6FE53", //陌生链接都敢乱点
    ];

    // 随机挑一个目标
    const target = PRANK_LINKS[Math.floor(Math.random() * PRANK_LINKS.length)];

    // 停顿 1 秒后跳转；用 replace，让对方按返回键回不到本页
    setTimeout(() => {
      window.location.replace(target);
    }, 1000);
  </script>
</body>
</html>
